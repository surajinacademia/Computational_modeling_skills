<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 977" width="1200" height="977" role="img" aria-labelledby="t d">
<title id="t">Project folders</title>
<desc id="d">A project folder holds AGENTS.md, README.md, environment.yml and pyproject.toml; model/ with one folder per model containing src, data, results, plots and docs; tests/ with RECORD.md and test files; shared src, scripts, data, results and plots folders; docs/; and paper/ with one folder per paper. Data, results and plots are kept on this computer only.</desc>
