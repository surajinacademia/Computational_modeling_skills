interface:
  display_name: "Schematic Designer"
  short_description: "Design accurate vector PDF schematics"
  default_prompt: "Use $schematic-designer to create or redraw an accurate scientific schematic with the maintainer's Minimalist palette, visual roles, CMU text, annotated LaTeX equations, native TikZ arrowheads, and spacing. Preserve the science and chosen renderer, edit TeX and Matplotlib source directly in their owning files, follow a relevant worked example, and inspect the final PDF at its intended size, adding an outlined-text SVG only when asked."
