<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Beat sheet of a scientific talk</title>
<desc id="d">A 16:9 diagram of the storyline of a scientific talk. On the left, a small scenery stands for the big picture and an enlarged single tree for detail, joined by dashed zoom lines; a bar beside them fades from light (big picture) to dark (detailed). A curve across three sections shows how detailed the talk is at each moment. Introduction: why it matters, what is known, the question, and the answer in brief. Results: each result goes down into detail and comes back up; between results the talk recaps and asks the next question. Conclusions: the answers, what changed, and what it means, followed by short acknowledgements and backup slides.</desc>
