<text x="800" y="224" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#003547" text-anchor="middle">Recap, then the next question</text>
<circle cx="1010.0" cy="227.5" r="6" fill="#003547"/>
<text x="996" y="276" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">The answers</text>
<circle cx="1070" cy="200" r="6" fill="#003547"/>
<text x="1070" y="178" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle">What changed</text>
<circle cx="1220" cy="200" r="6" fill="#003547"/>
<text x="1236" y="234" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="end">What it means</text>
<text x="1105" y="556" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="middle">Then: short acknowledgements</text>
<text x="1105" y="578" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#000000" text-anchor="middle">and backup slides</text>
<text x="215" y="640" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">Each result goes into detail and returns to a general answer.</text>
<text x="215" y="666" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">Each result: a title, as many points as the story needs, and an answer that leads to the next title.</text>
<text x="215" y="700" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#595959" text-anchor="start">Curve after the beat-sheet idea in B. Snyder, Save the Cat! (2005); stages after Ratcliff, Raj, McConnell, and Stern.</text>
</svg>
