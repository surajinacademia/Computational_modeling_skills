<circle cx="875" cy="545" r="6" fill="#00768c"/>
<text x="875" y="579" font-family="'CMU Sans Serif','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle">Result n</text>
<rect x="643" y="248" width="14" height="14" rx="2" fill="#ffffff" stroke="#003547" stroke-width="1.8"/>
<rect x="793" y="248" width="14" height="14" rx="2" fill="#ffffff" stroke="#003547" stroke-width="1.8"/>
